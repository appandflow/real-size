name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
            msvc: x64
          - os: windows-11-arm
            target: win32-arm64
            msvc: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      - run: npm run build
      - name: Static binary and POSIX launcher
        if: runner.os == 'Linux'
        run: |
          file prebuilds/${{ matrix.target }}/real-size | tee /dev/stderr | grep -q 'statically linked'
          dash -n bin/real-size
          sh -n bin/real-size
      - name: btrfs and XFS loopback mounts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq btrfs-progs xfsprogs > /dev/null
          for fs in btrfs xfs; do
            truncate -s 1G "$RUNNER_TEMP/$fs.img"
          done
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/xfs.img"
          for fs in btrfs xfs; do
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o loop "$RUNNER_TEMP/$fs.img" "/mnt/$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/$fs"
          done
          echo "REAL_SIZE_REFLINK_DIRS=/mnt/btrfs:/mnt/xfs" >> "$GITHUB_ENV"
      - name: ReFS volume
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'refs.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'refs.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=4096 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'format fs=refs quick label=refs',
            'assign letter=R'
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart failed with $LASTEXITCODE" }
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /W4 /WX test\fixtures\clone-windows.c /Fobuild\ /Febuild\clone.exe
          if ($LASTEXITCODE -ne 0) { throw "clone tool did not build" }
          "REAL_SIZE_REFS_DIR=R:\" >> $env:GITHUB_ENV
          "REAL_SIZE_CLONE_TOOL=$(Resolve-Path build\clone.exe)" >> $env:GITHUB_ENV
      - run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuilds/
  bench:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: macos-15-intel
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
            msvc: x64
          - os: windows-11-arm
            msvc: arm64
    runs-on: ${{ matrix.os }}
    name: bench (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      - run: npm run build
      - name: Benchmark on the runner's disk
        shell: bash
        run: node scripts/bench.mjs --cold --generate "$RUNNER_TEMP/bench"
      - name: Benchmark on btrfs and XFS
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq btrfs-progs xfsprogs > /dev/null
          for fs in btrfs xfs; do truncate -s 4G "$RUNNER_TEMP/$fs.img"; done
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/xfs.img"
          for fs in btrfs xfs; do
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o loop "$RUNNER_TEMP/$fs.img" "/mnt/$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/$fs"
            echo "### $fs"
            node scripts/bench.mjs --cold --generate "/mnt/$fs/bench"
          done
  package:
    needs: platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true
      - run: npm run pack:release
      - run: tar -tvzf real-size-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: real-size-*.tgz
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Install the tarball and run the CLI and the API
        shell: bash
        run: npm run test:package -- ./package/real-size-*.tgz
      - run: npm install --global pnpm@latest yarn@1
      - name: npm, pnpm, Yarn classic and Yarn Berry
        shell: bash
        run: |
          pnpm --version
          yarn --version
          status=0
          for manager in npm pnpm yarn-classic yarn-berry; do
            node scripts/managers-smoke.mjs "$manager" ./package/real-size-*.tgz || status=1
          done
          exit $status
      - name: Installed command start-up time
        if: runner.os != 'Windows'
        run: |
          dir=$(mktemp -d)
          npm install --prefix "$dir" --ignore-scripts --no-audit --no-fund ./package/real-size-*.tgz > /dev/null
          mkdir "$dir/tree" && echo hi > "$dir/tree/file"
          binary="$dir/node_modules/real-size/prebuilds/$(node -p 'process.platform + "-" + process.arch')/real-size"
          time (for i in $(seq 20); do "$dir/node_modules/.bin/real-size" "$dir/tree" > /dev/null; done)
          time (for i in $(seq 20); do "$binary" "$dir/tree" > /dev/null; done)
  alpine:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: npm, pnpm, Yarn classic and Yarn Berry on Alpine with BusyBox
        run: |
          mkdir .scratch
          docker run --rm -v "$PWD":/w -w /w -e TMPDIR=/w/.scratch node:22-alpine sh -c '
            ls -l /bin/sh /usr/bin/env
            npm install --global pnpm@latest > /dev/null
            pnpm --version
            yarn --version
            status=0
            for manager in npm pnpm yarn-classic yarn-berry; do
              node scripts/managers-smoke.mjs "$manager" ./package/real-size-*.tgz || status=1
            done
            exit $status'
