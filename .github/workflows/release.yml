name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: The version is not on the registry yet
        id: registry
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "real-size@$version" version > /dev/null 2>&1; then
            echo "::notice::real-size@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  ci:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [check, ci]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - run: npm publish ./package/real-size-*.tgz --provenance --access public
